/* Parliamo 2026 — rustige, moderne leeromgeving */
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18302c;background:#f6f8f6;font-synthesis:none}
html{scroll-behavior:smooth}body{min-height:100vh;background:radial-gradient(ellipse at 88% 0%,#e5f0e8 0,transparent 34%),#f6f8f6;line-height:1.55}

function sentenceMatches(answer,expected){
 const clean=x=>norm(String(x)).replace(/[’']/g,'').replace(/[!?.,;:]/g,' ').replace(/\s+/g,' ').trim();
 const given=clean(answer),options=String(expected).split('|').map(clean);
 const pronouns=['io','tu','lui','lei','noi','voi','loro'];
 const parts=x=>{const words=x.split(' ');return pronouns.includes(words[0])?{person:words[0],rest:words.slice(1).join(' ')}:{person:null,rest:x}};
 return options.some(x=>{
  if(x===given)return true;
  const a=parts(x),b=parts(given);
  // Een expliciet ander onderwerp mag nooit worden weggepoetst.
  if(a.person&&b.person&&a.person!==b.person)return false;
  return a.rest===b.rest;
 });
}

function reviewCandidates(){
 const now=Date.now(),pool=[];
 lessons.forEach((lesson,li)=>{
  if(!state.passedIds.includes(lesson.id))return;
  lesson.words.forEach(([it,nl],wi)=>{
   const key=lesson.id+':'+wi,rec=state.reviews[key]||{};
   pool.push({key,it,nl,li,type:'word',stage:rec.stage||0,due:rec.due||0});
  });
  sentenceExercises[li].forEach((sentence,si)=>{const key=lesson.id+':sentence'+si,rec=state.reviews[key]||{};

}

 {title:'Eerst begrijpen: jezelf voorstellen',intro:'Italiaanse werkwoorden veranderen afhankelijk van wie iets doet. Leer de betekenis voordat je een zin maakt.',rows:[['Io','Ik (onderwerp)'],['Tu','Jij (onderwerp)'],['Mi','Mezelf (bij chiamarsi)'],['Ti','Jezelf (bij chiamarsi)'],['Io mi chiamo','Ik heet'],['Tu ti chiami','Jij heet'],['Come ti chiami?','Hoe heet jij?'],['Tu chiami Luca','Jij belt of roept Luca'],['Sono','Ik ben']],rule:'Waarom «ti chiami» en niet «tu chiami»? «Tu» betekent «jij» (het onderwerp). «Ti» betekent hier «jezelf»: het hoort bij het wederkerende werkwoord «chiamarsi» (heten, letterlijk: zichzelf noemen). «Tu chiami» betekent «jij noemt of belt (iemand)»; «tu ti chiami» betekent «jij heet». Je mag «tu» weglaten, want «chiami» laat al zien dat het om jij gaat. «Come ti chiami?» betekent dus letterlijk «Hoe noem jij jezelf?» en gewoon «Hoe heet jij?». Vergelijk: «Io mi chiamo Luca» = ik heet Luca, maar «Io chiamo Luca» = ik bel of roep Luca. «Mi» betekent hier «mezelf» en «ti» betekent «jezelf».'},
 {title:'Eerst begrijpen: avere (hebben)',intro:'In het Italiaans zeg je letterlijk dat je een aantal jaren hébt. «Ho dodici anni» betekent dus: ik heb twaalf jaren.',rows:[['Io ho','Ik heb'],['Tu hai','Jij hebt'],['Lui / lei ha','Hij / zij heeft'],['Noi abbiamo','Wij hebben'],['Voi avete','Jullie hebben'],['Loro hanno','Zij hebben']],rule:'Bij leeftijd gebruik je het aantal jaren + anni. «Ho dodici anni» = ik ben twaalf jaar. «Hai undici anni?» = ben jij elf jaar? «Io» betekent alleen «ik» en is geen werkwoord. Daarom is «io dodici anni» onjuist: «ho» (ik heb) ontbreekt. «Io ho dodici anni» is correct, maar «ho dodici anni» ook: aan «ho» hoor je al dat het over «ik» gaat. Bij «tu hai» (jij hebt) kun je «tu» meestal weglaten, omdat «hai» al «jij hebt» betekent.'},
 {title:'Eerst begrijpen: essere en avere',intro:'De twee belangrijke werkwoorden zijn essere (zijn) en avere (hebben). Ze veranderen met de persoon.',rows:[['Io sono / ho','Ik ben / heb'],['Tu sei / hai','Jij bent / hebt'],['Lui / lei è / ha','Hij / zij is / heeft'],['Noi siamo / abbiamo','Wij zijn / hebben'],['Voi siete / avete','Jullie zijn / hebben'],['Loro sono / hanno','Zij zijn / hebben']],rule:'«Sono» betekent «ik ben», «ho» betekent «ik heb». Ze zijn niet uitwisselbaar: «sono dodici anni» is geen goede manier om je leeftijd te zeggen; daarvoor gebruik je «ho dodici anni». De vormen «sei» en «hai» horen bij «jij».'},
 {title:'Eerst begrijpen: beleefd iets vragen',intro:'In een restaurant kun je met één vaste structuur veel verschillende dingen bestellen.',rows:[['Vorrei','Ik zou graag willen'],['Un caffè','Een koffie'],['Un tè','Een thee'],['Per favore','Alstublieft']],rule:'Combineer «Vorrei» met wat je wilt: «Vorrei un caffè, per favore». Je hoeft nog niet alle vormen van volere te kennen.'},
 {title:'Eerst begrijpen: vraagwoorden',intro:'Leer eerst de vraagwoorden. Dan herken je wat iemand van je wil weten.',rows:[['Come?','Hoe?'],['Dove?','Waar?'],['Quando?','Wanneer?'],['Quanto?','Hoeveel?'],['Perché?','Waarom?']],rule:'«Dove» betekent alleen «waar»; «abiti» betekent «jij woont». Daarom is «dove tu?» geen volledige vraag naar iemands woonplaats. «Dove abiti?» is voldoende: «tu» hoeft er niet bij. Bij een ja-neevraag zoals «Abiti qui?» maakt de intonatie duidelijk dat het een vraag is.'},
 {title:'Eerst begrijpen: bezit en familie',intro:'Mio en mia betekenen allebei mijn. De vorm hangt af van het Italiaanse woord waar ze bij horen.',rows:[['Mio padre','Mijn vader'],['Mia madre','Mijn moeder'],['Tuo fratello','Jouw broer'],['Tua sorella','Jouw zus']],rule:'«Mio» en «mia» passen zich aan het woord aan dat erop volgt, niet aan het geslacht van de spreker: zowel een man als een vrouw zegt «mia madre». Bij enkelvoudige familieleden zeg je doorgaans «mio padre» zonder lidwoord; bij «il mio libro» staat het lidwoord er wel.'},
 {title:'Eerst begrijpen: lidwoorden',intro:'Italiaanse zelfstandige naamwoorden zijn grammaticaal mannelijk of vrouwelijk. Dat beïnvloedt het lidwoord.',rows:[['Il libro','Het boek'],['La casa','Het huis'],['Un libro','Een boek'],['Una casa','Een huis'],["Un'amica",'Een vriendin']],rule:'Het lidwoord hoort bij het grammaticale geslacht van het zelfstandig naamwoord: «il libro» maar «la casa». «Un amico» (een mannelijke vriend) heeft géén apostrof; «un’amica» (een vrouwelijke vriendin) wel. Dat verschil is belangrijker dan alleen de Nederlandse vertaling «een».'},
 {title:'Eerst begrijpen: hoe laat is het?',intro:'Bij één uur gebruik je een andere vorm dan bij twee uur of later.',rows:[["È l'una",'Het is één uur'],['Sono le due','Het is twee uur'],['Sono le tre','Het is drie uur'],['Alle otto','Om acht uur']],rule:'Bij één uur gebruik je «è» (het is): «È l’una». Bij twee uur en later gebruik je «sono» (zijn): «Sono le due». «Alle otto» betekent «om acht uur», dus niet «het is acht uur». Dat is het verschil tussen tijdstip noemen en vragen wanneer iets gebeurt.'},
 {title:'Eerst begrijpen: de weg vragen',intro:'Met drie richtingswoorden kun je eenvoudige aanwijzingen begrijpen.',rows:[['A destra','Naar rechts'],['A sinistra','Naar links'],['Dritto','Rechtdoor'],["Dov'è la stazione?",'Waar is het station?']],rule:'«Dov’è» is «dove» + «è» (waar is). Daarom zeg je «Dov’è la stazione?» en niet alleen «dove la stazione?» als volledige vraag. «A destra» is rechtsaf of aan de rechterkant; «a sinistra» links; «dritto» rechtdoor.'},
 {title:'Eerst begrijpen: beschrijven',intro:'Veel Italiaanse bijvoeglijke naamwoorden passen zich aan het grammaticale geslacht en aantal aan.',rows:[['Il libro rosso','Het rode boek'],['La casa rossa','Het rode huis'],['I libri rossi','De rode boeken'],['Le case rosse','De rode huizen']],rule:'De uitgang hoort bij het zelfstandig naamwoord, niet bij degene die spreekt: «il libro rosso», «la casa rossa», «i libri rossi», «le case rosse». «La casa rosso» klopt dus niet. Dit patroon geldt voor veel, maar niet alle, bijvoeglijke naamwoorden.'},
 {title:'Eerst begrijpen: een werkwoord vervoegen',intro:'Het werkwoord parlare betekent spreken. De uitgang verandert met wie spreekt.',rows:[['Io parlo','Ik spreek'],['Tu parli','Jij spreekt'],['Lui / lei parla','Hij / zij spreekt'],['Noi parliamo','Wij spreken'],['Voi parlate','Jullie spreken'],['Loro parlano','Zij spreken']],rule:'De uitgang laat zien wie spreekt: «parlo» = ik spreek, «parli» = jij spreekt, «parla» = hij/zij spreekt. «Io parli» is dus niet juist: «io» vraagt om «parlo». Het persoonlijk voornaamwoord mag vaak weg omdat de uitgang de persoon al aangeeft.'},
 {title:'Eerst begrijpen: reizen met per en in',intro:'Met korte voorzetsels geef je richting of bestemming aan.',rows:[['Per Roma','Naar Rome'],['In Italia','In / naar Italië'],['Un biglietto','Een kaartje'],['La stazione','Het station']],rule:'«Un biglietto per Roma» is een kaartje naar Rome. «Vado in Italia» betekent ik ga naar Italië.'},
 {title:'Eerst begrijpen: dagelijkse handelingen',intro:'Bij wederkerende werkwoorden hoort een klein woordje dat naar de persoon verwijst.',rows:[['Mi alzo','Ik sta op'],['Ti alzi','Jij staat op'],['Si alza','Hij / zij staat op'],['Ci alziamo','Wij staan op']],rule:'Bij «alzarsi» (opstaan) horen «mi», «ti» en «si» bij de persoon: «mi alzo» = ik sta op, «ti alzi» = jij staat op. Alleen «alzo» betekent letterlijk «ik til (iets) op» en is dus niet hetzelfde als «mi alzo».'},
 {title:'Eerst begrijpen: iets kopen',intro:'Met drie korte zinnen kun je al in een winkel terecht.',rows:[['Quanto costa?','Hoeveel kost het?'],['Posso pagare?','Kan ik betalen?'],['Con la carta','Met de betaalkaart'],['Cerco ...','Ik zoek ...']],rule:'Gebruik «Quanto costa?» voor één artikel. «Posso pagare con la carta?» betekent: kan ik met de kaart betalen?'},
 {title:'Eerst begrijpen: klachten uitleggen',intro:'In het Italiaans zeg je letterlijk dat je pijn hebt.',rows:[['Ho mal di testa','Ik heb hoofdpijn'],['Ho mal di gola','Ik heb keelpijn'],['Mi sento male','Ik voel me niet goed'],['Ho bisogno di aiuto','Ik heb hulp nodig']],rule:'«Ho mal di» combineer je met het lichaamsdeel of de klacht. Het werkwoord «ho» betekent ik heb.'},
 {title:'Eerst begrijpen: het weer',intro:'Italiaans gebruikt vaak «fa» om de temperatuur te beschrijven.',rows:[['Fa caldo','Het is warm'],['Fa freddo','Het is koud'],['Piove','Het regent'],['C’è il sole','De zon schijnt']],rule:'«Fa caldo» betekent niet letterlijk «het is warm», maar is wel de gebruikelijke Italiaanse formulering.'},
 {title:'Eerst begrijpen: iets leuk vinden',intro:'Bij piacere draait de vorm om wat je leuk vindt, niet om wie het leuk vindt.',rows:[['Mi piace la pizza','Ik houd van pizza'],['Mi piace leggere','Ik houd van lezen'],['Mi piacciono i libri','Ik houd van boeken'],['Non mi piace','Ik vind het niet leuk']],rule:'«Mi piace la pizza» betekent letterlijk ongeveer «pizza bevalt mij». Daarom gebruik je «piace» bij één ding of een werkwoord, maar «piacciono» bij meerdere dingen: «mi piacciono i libri». «Mi piaccio la pizza» is niet juist: het werkwoord volgt hier het onderwerp «la pizza».'},
 {title:'Eerst begrijpen: iemand beschrijven',intro:'Voor uiterlijk gebruik je in het Italiaans zowel avere als essere.',rows:[['Ho gli occhi verdi','Ik heb groene ogen'],['Ho i capelli scuri','Ik heb donker haar'],['Sono alto','Ik ben lang (man)'],['Sono alta','Ik ben lang (vrouw)']],rule:'Ogen en haar beschrijf je vaak met avere; lengte met essere. «Alto» en «alta» passen zich aan.'},
 {title:'Eerst begrijpen: een keuze bestellen',intro:'Met prendo kun je direct aangeven wat je wilt nemen.',rows:[['Prendo una pizza','Ik neem een pizza'],['Prendo un caffè','Ik neem een koffie'],['Vorrei un tè','Ik zou graag thee willen'],['Il menù, per favore','De menukaart, alstublieft']],rule:'«Prendo» is direct en gebruikelijk. «Vorrei» klinkt wat beleefder en voorzichtiger.'},
 {title:'Eerst begrijpen: kunnen, willen, moeten',intro:'Na potere, volere en dovere gebruik je meestal de infinitief: het hele werkwoord.',rows:[['Posso andare','Ik kan gaan'],['Voglio mangiare','Ik wil eten'],['Devo studiare','Ik moet studeren'],['Puoi aiutarmi?','Kun jij me helpen?']],rule:'«Posso» betekent «ik kan», «voglio» betekent «ik wil», «devo» betekent «ik moet». Daarna volgt het hele werkwoord: «posso parlare», niet «posso parlo». De eerste vorm vertelt al wie iets kan, wil of moet.'}
,
 {title:'Eerst begrijpen: regelmatige werkwoorden op -are',intro:'Een Italiaans werkwoord verandert met de persoon. Haal bij parlare (spreken) eerst -are weg: parl-. Voeg daarna de juiste uitgang toe.',rows:[['Io parlo','Ik spreek'],['Tu parli','Jij spreekt'],['Lui / lei parla','Hij / zij spreekt'],['Noi parliamo','Wij spreken'],['Voi parlate','Jullie spreken'],['Loro parlano','Zij spreken']],rule:'De uitgangen zijn -o, -i, -a, -iamo, -ate en -ano. Hetzelfde patroon zie je bij lavorare: «lavoro» = ik werk. «Io parlare» is onjuist als je «ik spreek» bedoelt: parlare is het hele werkwoord, parlo de vervoegde vorm.'},
 {title:'Eerst begrijpen: ontkennen met non',intro:'Wil je zeggen dat iets niet gebeurt? Zet non direct vóór het vervoegde werkwoord. De werkwoordsvorm verandert daardoor niet.',rows:[['Parlo italiano','Ik spreek Italiaans'],['Non parlo italiano','Ik spreek geen Italiaans'],['Capisco','Ik begrijp het'],['Non capisco','Ik begrijp het niet'],['Non posso','Ik kan niet'],['Non lo so','Ik weet het niet']],rule:'«Non» staat vóór het werkwoord: «non capisco», niet «capisco non». «Mai» betekent nooit; «non parlo mai» betekent ik spreek nooit. «No» is een los antwoord op een vraag; «non» ontkent binnen een zin.'},
 {title:'Eerst begrijpen: vragen maken',intro:'Veel Italiaanse ja-neevragen hebben dezelfde woordvolgorde als een mededeling. Met je stem laat je horen dat je een vraag stelt; schriftelijk gebruik je een vraagteken.',rows:[['Parli italiano.','Je spreekt Italiaans.'],['Parli italiano?','Spreek je Italiaans?'],['Dove abiti?','Waar woon je?'],['Quando parti?','Wanneer vertrek je?'],['Perché studi?','Waarom studeer je?'],['A che ora?','Hoe laat?']],rule:'Vraagwoorden staan meestal vooraan. «Dove» is waar, «quando» wanneer en «perché» waarom. Je hebt niet altijd een extra woord voor «doe» nodig: «Parli italiano?» is al een volledige vraag.'},
 {title:'Eerst begrijpen: werkwoorden op -ere en -ire',intro:'Ook bij -ere en -ire haal je de uitgang van het hele werkwoord weg en voeg je een persoonsuitgang toe. Let op: niet alle -ire-werkwoorden volgen precies hetzelfde patroon.',rows:[['Io leggo','Ik lees'],['Tu leggi','Jij leest'],['Lui / lei legge','Hij / zij leest'],['Noi leggiamo','Wij lezen'],['Io dormo','Ik slaap'],['Tu dormi','Jij slaapt'],['Noi dormiamo','Wij slapen']],rule:'Bij leggere (lezen) zie je leggo, leggi, legge, leggiamo, leggete, leggono. Bij dormire (slapen): dormo, dormi, dorme, dormiamo, dormite, dormono. «Io leggere» is geen correcte zin voor «ik lees»; gebruik «leggo». Sommige -ire-werkwoorden, zoals capire, krijgen -isc- in bepaalde vormen: «capisco».'}
];
// Niet-blokkerende kwaliteitscontrole: ontbrekende lesdata mogen de hele site nooit leegmaken.
function validateLessonContent(){
 const sets={basis:grammarFoundations,uitleg:grammarNotes,verdieping:grammarDeepDives,grammatica:grammarExercises,extraGrammatica:extraGrammarExercises,zinnen:sentenceExercises,luisteren:listeningDialogues,extraLuisteren:extraListeningDialogues};
 const issues=[];
 Object.entries(sets).forEach(([name,items])=>{
  if(!Array.isArray(items)||items.length!==lessons.length)issues.push(name+': '+(items?.length??0)+' van '+lessons.length);
  lessons.forEach((_,i)=>{if(!items?.[i])issues.push(name+' ontbreekt bij les '+(i+1))});
 });
 lessons.forEach((lesson,i)=>{
  if(!Array.isArray(lesson.words)||lesson.words.length<10)issues.push('Te weinig woorden in les '+(i+1));
  const q=grammarExercises[i];if(q&&(!q[0]||!q[1]))issues.push('Onvolledige grammaticavraag in les '+(i+1));
 });
 if(issues.length)console.warn('Parliamo inhoudscontrole:',issues);
 return issues;
}
validateLessonContent();
// Afzonderlijke klikafhandeling voor de dynamisch opgebouwde grammaticatabel.
document.addEventListener('click',function(e){
 const button=e.target.closest('[data-foundation-audio]');
 if(!button)return;
 e.preventDefault();
 const phrase=decodeURIComponent(button.getAttribute('data-foundation-audio'));
 const clean=phrase.replace(/\s*\/\s*/g,' of ').replace(/\s+/g,' ').trim();
 speak(clean);
});
// Vervoegingsleerlijn: eerst het patroon begrijpen, daarna zelfstandig ophalen.
const verbCourse=[
 {from:0,inf:'chiamarsi',nl:'heten',forms:['mi chiamo','ti chiami','si chiama','ci chiamiamo','vi chiamate','si chiamano'],explain:'Bij «chiamarsi» (heten) hoort een wederkerend voornaamwoord: mi = mezelf, ti = jezelf, si = zichzelf, ci = onszelf, vi = jezelf/julliezelf, si = zichzelf. Het woord «tu» betekent alleen «jij» en kan het wederkerende «ti» niet vervangen. Daarom is «tu chiami» (jij belt/noemt iemand) iets anders dan «tu ti chiami» (jij heet). «Come ti chiami?» betekent letterlijk «Hoe noem jij jezelf?»; het onderwerp «tu» is weggelaten, maar «ti» moet blijven staan. Ook bij «io mi chiamo» mag «io» weg, maar «mi» niet. Onthoud dus: onderwerp «io/tu» vaak optioneel, wederkerend «mi/ti» noodzakelijk voor de betekenis heten.',example:'Mi chiamo Luca. = Ik heet Luca.'},
 {from:1,inf:'avere',nl:'hebben',forms:['ho','hai','ha','abbiamo','avete','hanno'],explain:'Avere is onregelmatig. In het Italiaans zeg je «ho dodici anni»: letterlijk ik heb twaalf jaren. Het woord «io» is niet verplicht, maar «ho» wel.',example:'Hai dodici anni? = Ben jij twaalf jaar?'},
 {from:2,inf:'essere',nl:'zijn',forms:['sono','sei','è','siamo','siete','sono'],explain:'Essere is onregelmatig. Let op het accent in «è» (is). «E» zonder accent betekent «en». «Sono» kan ik ben of zij zijn betekenen; de context maakt het duidelijk.',example:'Noi siamo amici. = Wij zijn vrienden.'},
 {from:4,inf:'parlare',nl:'spreken',forms:['parlo','parli','parla','parliamo','parlate','parlano'],explain:'Regelmatig -are: haal -are weg en voeg -o, -i, -a, -iamo, -ate, -ano toe. Zo werkt ook abitare: abito, abiti, abita enzovoort.',example:'Tu parli italiano. = Jij spreekt Italiaans.'},
 {from:10,inf:'abitare',nl:'wonen',forms:['abito','abiti','abita','abitiamo','abitate','abitano'],explain:'Dit is een regelmatig -are-werkwoord. De uitgang geeft aan wie er woont. «Abito a Roma» betekent ik woon in Rome.',example:'Dove abiti? = Waar woon jij?'},
 {from:11,inf:'andare',nl:'gaan',forms:['vado','vai','va','andiamo','andate','vanno'],explain:'Andare is onregelmatig. Je leert de vormen als geheel: vado, vai, va, andiamo, andate, vanno. Gebruik «vado a Roma» en «vado in Italia».',example:'Noi andiamo a Roma. = Wij gaan naar Rome.'},
 {from:12,inf:'alzarsi',nl:'opstaan',forms:['mi alzo','ti alzi','si alza','ci alziamo','vi alzate','si alzano'],explain:'Dit is wederkerend: mi, ti, si, ci, vi, si. De uitgang van alzare volgt het regelmatige -are-patroon. «Mi alzo» betekent ik sta op.',example:'Mi alzo alle sette. = Ik sta om zeven uur op.'},
 {from:13,inf:'potere',nl:'kunnen / mogen',forms:['posso','puoi','può','possiamo','potete','possono'],explain:'Potere is onregelmatig. Na de vervoegde vorm volgt meestal een heel werkwoord: «posso pagare» (ik kan betalen), niet «posso pago».',example:'Posso pagare? = Kan ik betalen?'},
 {from:16,inf:'piacere',nl:'bevallen / leuk vinden',forms:['piaccio','piaci','piace','piacciamo','piacete','piacciono'],explain:'Bij «mi piace» is het leuke ding het grammaticale onderwerp: «mi piace la pizza» (één ding) en «mi piacciono i libri» (meerdere dingen). De overige vormen zijn minder belangrijk voor beginners.',example:'Mi piacciono i libri. = Ik houd van boeken.'},
 {from:18,inf:'prendere',nl:'nemen',forms:['prendo','prendi','prende','prendiamo','prendete','prendono'],explain:'Regelmatig -ere: haal -ere weg en voeg -o, -i, -e, -iamo, -ete, -ono toe. «Prendo» betekent ik neem; «prendiamo» betekent wij nemen.',example:'Prendo un caffè. = Ik neem een koffie.'},
 {from:19,inf:'volere',nl:'willen',forms:['voglio','vuoi','vuole','vogliamo','volete','vogliono'],explain:'Volere is onregelmatig. Na «voglio» volgt een heel werkwoord: «voglio mangiare» = ik wil eten. «Vorrei» is de beleefde vorm: ik zou graag willen.',example:'Voglio visitare Roma. = Ik wil Rome bezoeken.'},
 {from:19,inf:'dovere',nl:'moeten',forms:['devo','devi','deve','dobbiamo','dovete','devono'],explain:'Dovere is onregelmatig. Gebruik daarna het hele werkwoord: «devo studiare» = ik moet studeren. «Devo» en «debbo» komen beide voor; voor beginners gebruiken we «devo».',example:'Devo partire. = Ik moet vertrekken.'},
 {from:20,inf:'studiare',nl:'studeren',forms:['studio','studi','studia','studiamo','studiate','studiano'],explain:'Studiare volgt het -are-patroon. Bij tu staat «studi» (niet «studii»). De i in de stam zorgt hier niet voor een dubbele i.',example:'Noi studiamo italiano. = Wij studeren Italiaans.'},
 {from:20,inf:'mangiare',nl:'eten',forms:['mangio','mangi','mangia','mangiamo','mangiate','mangiano'],explain:'Mangiare is een -are-werkwoord met een spellingregel: vóór i-uitgangen blijft er één i staan, bijvoorbeeld «tu mangi» en «noi mangiamo».',example:'Loro mangiano la pizza. = Zij eten pizza.'},
 {from:23,inf:'leggere',nl:'lezen',forms:['leggo','leggi','legge','leggiamo','leggete','leggono'],explain:'Leggere heeft een spellingverandering in de stam: leggo, leggi, legge. Leer de vormen hardop en vergelijk met het regelmatige -ere-patroon.',example:'Tu leggi un libro. = Jij leest een boek.'},
 {from:23,inf:'dormire',nl:'slapen',forms:['dormo','dormi','dorme','dormiamo','dormite','dormono'],explain:'Regelmatig -ire: haal -ire weg en voeg -o, -i, -e, -iamo, -ite, -ono toe. Niet elk -ire-werkwoord volgt dit patroon; «capire» heeft bijvoorbeeld «capisco».',example:'Noi dormiamo bene. = Wij slapen goed.'},
 {from:23,inf:'capire',nl:'begrijpen',forms:['capisco','capisci','capisce','capiamo','capite','capiscono'],explain:'Bij veel -ire-werkwoorden verschijnt -isc- bij io, tu, lui/lei en loro. Niet bij noi en voi. Daarom zeg je «capisco», maar «capiamo».',example:'Non capisco. = Ik begrijp het niet.'},
 {from:23,inf:'fare',nl:'doen / maken',forms:['faccio','fai','fa','facciamo','fate','fanno'],explain:'Fare is onregelmatig. De vormen zijn faccio, fai, fa, facciamo, fate, fanno. «Che fai?» betekent: wat doe je?',example:'Che fai oggi? = Wat doe je vandaag?'},
 {from:23,inf:'stare',nl:'zijn / zich bevinden',forms:['sto','stai','sta','stiamo','state','stanno'],explain:'Stare is onregelmatig. Bij «come stai?» gebruik je stare om te vragen hoe iemand zich voelt. Antwoord: «sto bene» (het gaat goed).',example:'Come stai? Sto bene. = Hoe gaat het? Het gaat goed.'},
 {from:23,inf:'venire',nl:'komen',forms:['vengo','vieni','viene','veniamo','venite','vengono'],explain:'Venire is onregelmatig. «Vengo» betekent ik kom; «vieni» betekent jij komt. «Da dove vieni?» betekent waar kom je vandaan?',example:'Vieni domani? = Kom je morgen?'},
 {from:23,inf:'sapere',nl:'weten / kunnen',forms:['so','sai','sa','sappiamo','sapete','sanno'],explain:'Sapere is onregelmatig. «Non lo so» betekent ik weet het niet. Voor een vaardigheid zeg je bijvoorbeeld «so nuotare» = ik kan zwemmen.',example:'Sai parlare italiano? = Kun je Italiaans spreken?'},
 {from:23,inf:'bere',nl:'drinken',forms:['bevo','bevi','beve','beviamo','bevete','bevono'],explain:'Bere heeft een afwijkende stam bev-. Je zegt «bevo» (ik drink), «bevi» (jij drinkt) en «beviamo» (wij drinken).',example:'Bevo acqua. = Ik drink water.'},
 {from:23,inf:'uscire',nl:'uitgaan / naar buiten gaan',forms:['esco','esci','esce','usciamo','uscite','escono'],explain:'Uscire is onregelmatig: esco, esci, esce en escono, maar usciamo en uscite. Let op de stamwisseling.',example:'Esco alle otto. = Ik ga om acht uur weg.'}
];
const verbPersons=[['io','ik'],['tu','jij'],['lui / lei','hij / zij'],['noi','wij'],['voi','jullie'],['loro','zij']];
function verbsForLesson(n){return verbCourse.filter(v=>v.from===n)}
function verbPracticeForLesson(n){return verbCourse.filter(v=>v.from<=n)}
function renderVerbLessons(n){
 const verbs=verbsForLesson(n);if(!verbs.length)return '';
 return '<section class="card lesson-stage" style="margin-top:14px"><div class="eyebrow">WERKWOORDEN · STAP VOOR STAP</div><h3>Leer vervoegen, niet alleen herkennen</h3><p>Een infinitief is het hele werkwoord, bijvoorbeeld «parlare» (spreken). Je kiest de juiste vorm op basis van wie iets doet. Lees de tabel, luister naar de vormen en probeer daarna de rij zonder te kijken op te zeggen. De persoonlijke voornaamwoorden mag je vaak weglaten, maar de werkwoordsvorm blijft nodig.</p>'+verbs.map(v=>'<div style="margin-top:20px"><h3>'+esc(v.inf)+' — '+esc(v.nl)+'</h3><p>'+esc(v.explain)+'</p><div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">'+v.forms.map((form,i)=>'<tr><td style="padding:8px;border-bottom:1px solid #e3e9e3">'+esc(verbPersons[i][0])+' <span class="muted">('+esc(verbPersons[i][1])+')</span></td><td style="padding:8px;border-bottom:1px solid #e3e9e3"><strong>'+esc(form)+'</strong></td><td><button class="btn secondary" type="button" data-foundation-audio="'+encodeURIComponent(form)+'" aria-label="Luister naar '+esc(form)+'">▶</button></td></tr>').join('')+'</table></div><p><strong>In een zin:</strong> '+esc(v.example)+'</p><details><summary>Controleer jezelf: welke vorm hoort bij «wij»?</summary><p><strong>'+esc(v.forms[3])+'</strong> — '+esc(v.explain)+'</p></details></div>').join('')+'</section>';
}
function renderPriorKnowledge(n){
 if(n===0)return '<section class="card lesson-stage" style="margin-top:14px"><div class="eyebrow">VOORKENNIS</div><h3>Je begint bij nul</h3><p>Je hebt nog geen Italiaanse voorkennis nodig. Na deze les komen eerdere woorden en regels steeds kort terug.</p></section>';
 const prev=lessons[n-1],word=prev.words[0],verb=verbPracticeForLesson(n-1).slice(-1)[0];

function renderQuiz(){let l=lessons[current];if(idx===-1){app.innerHTML=`<div class="lesson-cover"><div class="lesson-cover-copy"><div class="eyebrow">LEERPAD · LES ${current+1} VAN ${lessons.length}</div><h2>${esc(l.title)}</h2><p>${esc(l.goal)}</p><div class="lesson-cover-tags"><span>① Begrijpen</span><span>② Oefenen</span><span>③ Toepassen</span></div></div><div class="lesson-cover-art" aria-hidden="true">✦</div></div><div class="lesson-content card"><div class="lesson-intro"><span class="lesson-step-icon">01</span><div><div class="eyebrow">EERST BEGRIJPEN</div><p>${esc(l.explain)}</p></div></div>${renderPriorKnowledge(current)}${renderGrammarFoundation(current)}${renderVerbLessons(current)}<div class="card lesson-stage" style="box-shadow:none;border-color:#cfe3d4;margin-top:14px"><div class="eyebrow">Stap 2 · Uitleg en voorbeelden</div><h3>${esc(grammarNotes[current][0])}</h3><p>${esc(grammarNotes[current][1])}</p><p><strong>${esc(grammarNotes[current][2])}</strong> <button class="btn secondary" onclick="speak(grammarNotes[current][2])">▶</button></p><p class="muted">${esc(grammarNotes[current][3])}</p><h3>Zo werkt het</h3><p>${esc(grammarDeepDives[current][0])}</p><p><strong>${esc(grammarDeepDives[current][1])}</strong> <button class="btn secondary" onclick="speak(grammarDeepDives[current][1])">▶</button></p><p class="muted">${esc(grammarDeepDives[current][2])}</p><h3>Stap 3 · Controleer jezelf</h3><p>${esc(grammarExercises[current][0])}</p><details><summary>Bekijk de uitleg en het antwoord</summary><p><strong>${esc(grammarExercises[current][1])}</strong> — ${esc(grammarExercises[current][2])}</p></details></div><div class="card lesson-stage" style="box-shadow:none;border-color:#cfe3d4;margin-top:14px"><div class="eyebrow">Stap 4 · Zinnen in context · luister en zeg na</div><p class="muted">Lees eerst de Nederlandse betekenis, luister daarna en zeg de Italiaanse zin na. Dek de Italiaanse tekst vervolgens af en probeer de zin zelf te herinneren. Zo oefen je actief ophalen.</p>${sentenceExercises[current].map((example,i)=>`<div class="row" style="border-bottom:1px solid #eef2ee;padding:12px 0;gap:10px"><div><div class="sub">${esc(example.dutch)}</div><details><summary>Toon Italiaanse zin · controleer jezelf</summary><strong>${i+1}. ${esc(example.italian)}</strong></details></div><button class="btn secondary" aria-label="Beluister voorbeeldzin" onclick="speak(${JSON.stringify(example.italian).replace(/"/g,'&quot;')})">▶</button></div>`).join('')}</div><div class="lesson-vocabulary-heading"><span class="lesson-step-icon">05</span><h3>Woorden van deze les</h3></div><div class="lesson-vocabulary">${l.words.map(([it,nl])=>`<div class="row" style="border-bottom:1px solid #eef2ee;padding:9px 0;gap:12px"><div><strong>${esc(it)}</strong><div class="sub">${esc(nl)}</div></div><button class="btn secondary" aria-label="Luister naar ${esc(it)}" onclick="speak(${JSON.stringify(it).replace(/"/g,'&quot;')})">▶</button></div>`).join('')}</div><p class="muted">Leercheck: kun je zonder te kijken de voorbeeldzinnen terughalen? Zo niet, oefen ze nog één keer voordat je begint.</p><button class="btn" onclick="idx=0;renderQuiz()">Start toets (10 vragen) →</button><p class="foot">Met spraakherkenning controleert de browser herkende woorden, niet de uitspraak. Zonder spraakherkenning kun je hardop oefenen en het antwoord typen.</p></div>`;return}if(idx>=questions.length){finish();return}let q=questions[idx];app.innerHTML=`<div class="card question-card"><div class="row"><span class="eyebrow">Les ${current+1} · Vraag ${idx+1}/10</span><span class="pill">${q.type==='speak'?'Spreken':(q.type==='listen'||q.type==='dialogue')?'Luisteren':q.type==='write'?'Schrijven':q.type==='sentence'?'Zinsbouw':q.type==='grammar'?'Grammatica':'Woordenschat'}</span></div><div class="bar"><div class="fill" style="width:${idx*10}%"></div></div><h2>${esc(q.question)}</h2>${q.type==='dialogue'?`<p><button class="btn secondary" onclick="speakDialogue(questions[idx].audio)"> lse next()}});writtenField.focus()}if(q.type==='listen')setTimeout(()=>speak(q.correct),250);if(q.type==='dialogue')setTimeout(()=>{if(questions[idx]===q)speakDialogue(q.audio)},350)}function choose(i){selection=questions[idx].options[i];document.querySelectorAll('.choice').forEach((el,j)=>el.classList.toggle('selected',j===i))}function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('micStatus').textContent='Spraakherkenning is hier niet beschikbaar. Probeer Chrome of een browser met SpeechRecognition-ondersteuning.';return}let r=new SR();r.lang='it-IT';r.interimResults=false;r.maxAlternatives=3;document.getElementById('micStatus').textContent='Luistert...';r.onresult=e=>{spoken=Array.from(e.results[0]).some(a=>norm(a.transcript)===norm(questions[idx].correct));document.getElementById('micStatus').textContent='Herkend: '+e.results[0][0].transcript+(spoken?' ✓':' — probeer nog eens');document.getElementById('check').disabled=false};r.onerror=e=>document.getElementById('micStatus').textContent='Microfoonfout: '+e.error;r.start()}let questionMistakes=0;

  if(field){field.value='';field.focus()}

 document.getElementById('fb').innerHTML=`<div class="feedback"><strong>${firstTry?'Goed gedaan!':'Goed verbeterd!'}</strong><p>Correct: <strong>${esc(q.correct)}</strong></p>${q.explanation?'<p>Betekenis: '+esc(q.explanation)+'</p>':''}${firstTry?'':'<p>Je hebt het antwoord verbeterd. Voor je toetsscore telt de eerste poging.</p>'}</div>`;
