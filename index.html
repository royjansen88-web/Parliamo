function quizFor(n){
 const words=lessons[n].words;
 const chosen=shuffle(words.map((_,i)=>i)).slice(0,10);
 const qs=[];
 for(let i=0;i<4;i++){
  const w=words[chosen[i]], distractors=shuffle([...new Set(words.map(x=>x[1]).filter(x=>x!==w[1]))]).slice(0,3);
  qs.push({type:'choice',question:`Wat betekent “${w[0]}”?`,correct:w[1],options:shuffle([w[1],...distractors]),word:w[0]});
 }
 for(let i=4;i<7;i++){
  const w=words[chosen[i]];
  qs.push({type:'write',question:`Schrijf in het Italiaans: ${w[1]}`,correct:w[0],word:w[0]});
 }
 if(grammarExercises[n]){
  const g=grammarExercises[n];

  const sentence=shuffle(sentenceExercises[n])[0];
  qs[5]={type:'sentence',question:'Schrijf de volledige zin in het Italiaans: '+sentence.dutch,correct:sentence.italian,word:sentence.italian,explanation:'Voorbeeldzin uit de les. Let op de woordvolgorde.'};
 }
 const listening=words[chosen[7]];

 qs.push({type:'dialogue',question:dialogue[1],correct:dialogue[2],options:shuffle(dialogue[3]),audio:dialogue[0],word:dialogue[0]});
 for(let i=8;i<10;i++){
  const w=words[chosen[i]];
  qs.push({type:'speak',question:`Zeg hardop: “${w[0]}”`,correct:w[0],word:w[0]});
 }
 if(n>0){
  const pool=[];
  for(let lessonIndex=0;lessonIndex<n;lessonIndex++){
   if(!state.passedIds.includes(lessons[lessonIndex].id))continue;
   lessons[lessonIndex].words.forEach(([it,nl],wordIndex)=>{
    const key=lessons[lessonIndex].id+':'+wordIndex;
    const record=state.reviews[key]||{};
    pool.push({it,nl,key,lessonIndex,due:record.due||0,stage:record.stage||0});
   });
  }
  const now=Date.now();
  const due=shuffle(pool.filter(w=>w.due<=now)).sort((a,b)=>a.due-b.due);
  const selected=[...due.slice(0,2)];
  if(selected.length<2)selected.push(...shuffle(pool.filter(w=>!selected.includes(w))).slice(0,2-selected.length));
  selected.forEach((w,i)=>{
   const position=i===0?1:5;
   const distractors=shuffle([...new Set(words.map(x=>x[1]).filter(x=>x!==w.nl))]).slice(0,3);
   qs[position]={type:'choice',question:`Herhaling uit les ${w.lessonIndex+1}: wat betekent “${w.it}”?`,correct:w.nl,options:shuffle([w.nl,...distractors]),word:w.it,reviewKey:w.key,sourceLesson:w.lessonIndex};
  });
 }
 return qs;
}

function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(current!==null){renderQuiz();return}if(tab==='home'){let p=state.passed.length;app.innerHTML=`<div class="card"><div class="eyebrow">Jouw leerroute · pre-A1 en A1</div><div class="row"><div><div class="big">${p}/${lessons.length}</div><div class="muted">lessen behaald</div></div><span class="pill">${p===lessons.length?'Module afgerond':'Startniveau'}</span></div><div class="bar"><div class="fill" style="width:${p/lessons.length*100}%"></div></div><p class="muted">Een les is behaald bij minimaal 80% en beide spreekopdrachten afgerond. Bij onvoldoende oefen je opnieuw.</p></div><div class="card"><div class="eyebrow">Lessen</div><div class="grid">${lessons.map((l,i)=>`<button class="lesson" ${i>0&&!state.passed.includes(i-1)?'disabled':''} onclick="start(${i})"><span class="pill">${state.passed.includes(i)?'✓ Behaald':i>0&&!state.passed.includes(i-1)?'🔒 Gesloten':'Beschikbaar'}</span><strong>${i+1}. ${esc(l.title)}</strong><small>${esc(l.goal)}</small></button>`).join('')}</div></div><div class="card"><div class="eyebrow">Werkwijze</div><p>Lees de uitleg, beluister woorden en maak 10 toetsvragen. Vanaf les 2 herhaal je automatisch twee woorden uit eerdere behaalde lessen. Fouten keren sneller terug.</p></div>`}else if(tab==='words'){let available=lessons.slice(0,Math.min(lessons.length,state.passed.length+1));app.innerHTML=`<div class="card"><div class="eyebrow">Woordentrainer</div><h2>Luister, leer en herhaal</h2><p class="muted">${available.length*20} woorden beschikbaar. Tik op het luidsprekertje om de Italiaanse uitspraak te horen.</p><select id="wl" style="padding:12px;border-radius:10px;width:100%;margin-bottom:12px">${available.map((l,i)=>`<option value="${i}">${i+1}. ${esc(l.title)}</option>`).join('')}</select><div id="wordlist"></div></div>`;document.getElementById('wl').onchange=wordlist;wordlist();app.insertAdjacentHTML('beforeend',audioSettings())}else if(tab==='review'){renderReview();}else if(tab==='diagnostic'){renderDiagnostic();}else if(tab==='practice'){app.innerHTML=`<div class="card"><div class="eyebrow">Gericht oefenen</div><h2>Extra oefenen</h2><p>Kies een vrijgespeelde les. Je kunt dezelfde vaardigheden opnieuw trainen. Bij iedere poging krijg je nieuwe woorden. Vanaf les 2 komen er ook twee herhalingsvragen uit eerder behaalde lessen. Lastige woorden keren sneller terug.</p>${lessons.map((l,i)=>`<p><button class="btn ${i>0&&!state.passed.includes(i-1)?'secondary':''}" ${i>0&&!state.passed.includes(i-1)?'disabled':''} onclick="start(${i})">${esc(l.title)} →</button></p>`).join('')}</div>`}else{let attempts=state.attempts;app.innerHTML=`<div class="card"><div class="eyebrow">Mijn ontwikkeling</div><h2>Voortgang</h2><p><strong>${state.passed.length}</strong> van de ${lessons.length} lessen behaald</p><p><strong>${attempts.length}</strong> toetsen gemaakt</p><p><strong>${attempts.length?Math.round(attempts.reduce((s,a)=>s+a.score,0)/attempts.length):0}%</strong> gemiddelde toetsscore</p><div class="bar"><div class="fill" style="width:${state.passed.length/lessons.length*100}%"></div></div><h3>Toetshistorie</h3>${attempts.slice(-8).reverse().map(a=>`<p class="muted">${esc(lessons[a.lesson].title)} · ${a.score}% · ${esc(a.date)}</p>`).join('')||'<p class="muted">Nog geen toetsen gemaakt.</p>'}</div><div class="card"><div class="eyebrow">Veiligstellen van je voortgang</div><p>Je voortgang staat nu in deze browser. Maak regelmatig een back-up en bewaar die op een veilige plek. Met terugzetten vervang je de huidige voortgang.</p><div class="row" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn" onclick="exportProgress()">Download back-up</button><button class="btn secondary" onclick="document.getElementById('progressBackup').click()">Herstel back-up</button><input id="progressBackup" type="file" accept=".json,application/json" style="display:none" onchange="importProgress(this)"></div><p class="foot">De code wordt via GitHub bewaard met versiegeschiedenis. Je leerresultaten worden nog niet online gesynchroniseerd.</p></div>`}}
let reviewSession=[],reviewIndex=0,reviewRevealed=false,reviewMistakes=0;
function reviewCandidates(){
 const now=Date.now(),pool=[];
 lessons.forEach((lesson,li)=>{
  if(!state.passedIds.includes(lesson.id))return;
  lesson.words.forEach(([it,nl],wi)=>{
   const key=lesson.id+':'+wi,rec=state.reviews[key]||{};
   pool.push({key,it,nl,li,type:'word',stage:rec.stage||0,due:rec.due||0});
  });
  sentenceExercises[li].forEach((sentence,si)=>{const key=lesson.id+':sentence'+si,rec=state.reviews[key]||{};
   pool.push({key,it:sentence.italian,nl:sentence.dutch,li,type:'sentence',stage:rec.stage||0,due:rec.due||0});});
 });
 return pool.sort((a,b)=>a.due-b.due||a.stage-b.stage);
}
function startReview(){
 const pool=reviewCandidates(),now=Date.now();
 const due=pool.filter(w=>w.due<=now);
 const sentences=shuffle(due.filter(w=>w.type==='sentence')).slice(0,3);
 const words=shuffle(due.filter(w=>w.type==='word')).slice(0,12-sentences.length);
 reviewSession=shuffle([...sentences,...words]);
 reviewIndex=0;reviewRevealed=false;reviewMistakes=0;renderReview();
}
function submitReview(){
 const w=reviewSession[reviewIndex],field=document.getElementById('reviewAnswer');
 if(!w||!field)return;
 const answer=field.value.trim();
 if(!answer){field.focus();return}
 const correct=sentenceMatches(answer,w.it);
 if(!correct){
  reviewMistakes++;
  reviewRevealed=true;
  document.getElementById('reviewFeedback').innerHTML=`<div class="feedback bad">Nog niet goed. Het juiste antwoord is: <strong>${esc(w.it)}</strong>. Typ het opnieuw om verder te gaan.</div>`;
  field.value='';field.focus();return;
 }
 const prev=state.reviews[w.key]||{stage:0};
 const stage=reviewMistakes===0?Math.min((prev.stage||0)+1,5):0;
 const days=[1,2,4,7,14,30][stage];
 state.reviews[w.key]={stage,due:Date.now()+days*86400000,lastCorrect:reviewMistakes===0,lastSeen:new Date().toISOString()};
 save();reviewIndex++;reviewRevealed=false;reviewMistakes=0;renderReview();
}
function renderReview(){
 const pool=reviewCandidates(),due=pool.filter(w=>w.due<=Date.now());
 if(reviewSession.length&&reviewIndex<reviewSession.length){
  const w=reviewSession[reviewIndex];
  app.innerHTML=`<div class="card"><div class="eyebrow">Herhaalronde · ${reviewIndex+1}/${reviewSession.length}</div><div class="bar"><div class="fill" style="width:${reviewIndex/reviewSession.length*100}%"></div></div><p class="muted">Uit les ${w.li+1} · ${w.type==='sentence'?'Schrijf de hele zin':'Schrijf het woord'} in het Italiaans</p><h2>${esc(w.nl)}</h2><input id="reviewAnswer" type="text" autocomplete="off" placeholder="Typ je Italiaanse antwoord" onkeydown="if(event.key==='Enter')submitReview()"><p><button class="btn" onclick="submitReview()">Controleer antwoord</button> <button class="btn secondary" onclick="speak(reviewSession[reviewIndex].it)">▶ Luister</button></p><div id="reviewFeedback">${reviewRevealed?'<p class="muted">Vul het juiste antwoord zelf in om verder te gaan.</p>':''}</div></div>`;
  document.getElementById('reviewAnswer').focus();
  return;
 }
 if(reviewSession.length&&reviewIndex>=reviewSession.length){
  reviewSession=[];reviewIndex=0;
  app.innerHTML=`<div class="card"><h2>Herhaalronde afgerond</h2><p>Goed gewerkt. De volgende herhaling wordt gepland op basis van je antwoorden.</p><button class="btn" onclick="renderReview()">Bekijk herhaalplanning</button></div>`;
  return;
 }
 app.innerHTML=`<div class="card"><div class="eyebrow">Gespreide herhaling</div><h2>Jouw dagelijkse herhaling</h2><p><strong>${due.length}</strong> woorden en zinnen klaar voor herhaling uit <strong>${state.passedIds.length}</strong> behaalde lessen.</p><p class="muted">Typ zelf de Italiaanse vertaling van het woord of de volledige zin. Een fout antwoord moet je verbeteren voordat je verder kunt. Alleen een goed antwoord bij de eerste poging telt als direct beheerst. Lastige woorden komen eerder terug. Per ronde maximaal 12 woorden.</p>${due.length?`<button class="btn" onclick="startReview()">Start herhaling (${Math.min(due.length,12)} opdrachten)</button>`:`<p>Geen woorden gepland. Rond eerst een les af of kom later terug.</p>`}</div>`;
}
function wordlist(){let n=Number(document.getElementById('wl').value);document.getElementById('wordlist').innerHTML=lessons[n].words.map(([it,nl])=>`<div class="row" style="border-bottom:1px solid #eef2ee;padding:11px 0"><div><strong>${esc(it)}</strong><div class="sub">${esc(nl)}</div></div><button class="btn secondary" aria-label="Luister naar ${esc(it)}" onclick="speak(${JSON.stringify(it).replace(/"/g,'&quot;')})">▶</button></div>`).join('')}
function start(n){current=n;questionMistakes=0;idx=-1;questions=quizFor(n);answers=[];selection=null;spoken=false;feedback=null;renderQuiz();window.scrollTo(0,0)}function renderQuiz(){let l=lessons[current];if(idx===-1){app.innerHTML=`<div class="card"><span class="pill">Les ${current+1}</span><h2>${esc(l.title)}</h2><p>${esc(l.goal)}</p><div class="feedback">${esc(l.explain)}</div><div class="card" style="box-shadow:none;border-color:#cfe3d4;margin-top:14px"><div class="eyebrow">Grammatica en voorbeeldzin</div><h3>${esc(grammarNotes[current][0])}</h3><p>${esc(grammarNotes[current][1])}</p><p><strong>${esc(grammarNotes[current][2])}</strong> <button class="btn secondary" onclick="speak(grammarNotes[current][2])">▶</button></p><p class="muted">${esc(grammarNotes[current][3])}</p></div><h3>Woorden van deze les</h3>${l.words.map(([it,nl])=>`<div class="row" style="border-bottom:1px solid #eef2ee;padding:9px 0;gap:12px"><div><strong>${esc(it)}</strong><div class="sub">${esc(nl)}</div></div><button class="btn secondary" aria-label="Luister naar ${esc(it)}" onclick="speak(${JSON.stringify(it).replace(/"/g,'&quot;')})">▶</button></div>`).join('')}<button class="btn" onclick="idx=0;renderQuiz()">Start toets (10 vragen) →</button><p class="foot">Spreken vereist microfoontoestemming en browserondersteuning. Zonder spraakherkenning kun je spreekopdrachten niet automatisch laten beoordelen.</p></div>`;return}if(idx>=questions.length){finish();return}let q=questions[idx];app.innerHTML=`<div class="card"><div class="row"><span class="eyebrow">Les ${current+1} · Vraag ${idx+1}/10</span><span class="pill">${q.type==='speak'?'Spreken':(q.type==='listen'||q.type==='dialogue')?'Luisteren':q.type==='write'?'Schrijven':q.type==='sentence'?'Zinsbouw':q.type==='grammar'?'Grammatica':'Woordenschat'}</span></div><div class="bar"><div class="fill" style="width:${idx*10}%"></div></div><h2>${esc(q.question)}</h2>${q.type==='dialogue'?`<p><button class="btn secondary" onclick="speakDialogue(questions[idx].audio)">▶ Luister naar gesprek</button></p><p class="muted">Luister naar het Italiaans en kies het juiste antwoord.</p><div class="choices">${q.options.map((o,i)=>`<button class="choice" onclick="choose(${i})" id="opt${i}">${esc(o)}</button>`).join('')}</div>`:q.type==='choice'?`<div class="choices">${q.options.map((o,i)=>`<button class="choice" onclick="choose(${i})" id="opt${i}">${esc(o)}</button>`).join('')}</div>`:(q.type==='write'||q.type==='grammar'||q.type==='sentence')?`<input id="written" type="text" autocomplete="off" placeholder="Typ je antwoord" />`:q.type==='listen'?`<p><button class="btn secondary" onclick="speak(${JSON.stringify(q.correct).replace(/"/g,'&quot;')})">▶ Speel fragment af</button></p><input id="written" type="text" autocomplete="off" placeholder="Wat hoor je?" />`:`<p><button class="btn secondary" onclick="speak(${JSON.stringify(q.correct).replace(/"/g,'&quot;')})">▶ Luister naar voorbeeld</button></p><button class="btn secondary" id="mic" onclick="recordSpeech()">🎙 Spreek antwoord in</button><p class="sub" id="micStatus">De browser beoordeelt je uitspraak via spraakherkenning. Dit is een indicatie, geen betrouwbare fonetische analyse.</p>`}<div id="fb"></div><p><button class="btn" id="check" onclick="check()" ${q.type==='speak'?'disabled':''}>Controleer antwoord</button> <button class="btn secondary hidden" id="next" onclick="next()">Volgende →</button></p></div>`;if(q.type==='listen')setTimeout(()=>speak(q.correct),250);if(q.type==='dialogue')setTimeout(()=>{if(questions[idx]===q)speakDialogue(q.audio)},350)}function choose(i){selection=questions[idx].options[i];document.querySelectorAll('.choice').forEach((el,j)=>el.classList.toggle('selected',j===i))}function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('micStatus').textContent='Spraakherkenning is hier niet beschikbaar. Probeer Chrome of een browser met SpeechRecognition-ondersteuning.';return}let r=new SR();r.lang='it-IT';r.interimResults=false;r.maxAlternatives=3;document.getElementById('micStatus').textContent='Luistert...';r.onresult=e=>{spoken=Array.from(e.results[0]).some(a=>norm(a.transcript)===norm(questions[idx].correct));document.getElementById('micStatus').textContent='Herkend: '+e.results[0][0].transcript+(spoken?' ✓':' — probeer nog eens');document.getElementById('check').disabled=false};r.onerror=e=>document.getElementById('micStatus').textContent='Microfoonfout: '+e.error;r.start()}let questionMistakes=0;
function check(){
 const q=questions[idx],field=document.getElementById('written');
 const v=(q.type==='choice'||q.type==='dialogue')?selection:q.type==='speak'?(spoken?q.correct:''):field.value;
 if(!v&&q.type!=='speak'){alert('Vul eerst een antwoord in.');return}
 const good=q.type==='sentence'?sentenceMatches(v,q.correct):norm(v)===norm(q.correct);
 if(!good){
  questionMistakes++;
  document.getElementById('fb').innerHTML=`<div class="feedback bad"><strong>Nog niet goed. Probeer opnieuw.</strong><p>Het juiste antwoord is: <strong>${esc(q.correct)}</strong></p>${q.explanation?'<p>'+esc(q.explanation)+'</p>':''}<p>Je kunt pas verder wanneer je het juiste antwoord zelf geeft.</p></div>`;
  if(field){field.value='';field.focus()}
  if(q.type==='choice'||q.type==='dialogue'){selection=null;document.querySelectorAll('.choice').forEach(el=>el.classList.remove('selected'))}
  if(q.type==='speak'){spoken=false;document.getElementById('check').disabled=true}
  return;
 }
 const firstTry=questionMistakes===0;
 answers.push({good:firstTry,corrected:!firstTry,expected:q.correct,got:v,type:q.type,reviewKey:q.reviewKey||null});
 if(q.reviewKey){
  const prev=state.reviews[q.reviewKey]||{stage:0};
  const stage=firstTry?Math.min((prev.stage||0)+1,5):0;
  const days=[1,2,4,7,14,30][stage];
  state.reviews[q.reviewKey]={stage,due:Date.now()+days*86400000,lastCorrect:firstTry,lastSeen:new Date().toISOString()};
  save();
 }
 document.getElementById('fb').innerHTML=`<div class="feedback"><strong>${firstTry?'Goed gedaan!':'Goed verbeterd!'}</strong><p>Correct: <strong>${esc(q.correct)}</strong></p>${q.explanation?'<p>Betekenis: '+esc(q.explanation)+'</p>':''}${firstTry?'':'<p>Je hebt het antwoord verbeterd. Voor je toetsscore telt de eerste poging.</p>'}</div>`;
 document.getElementById('check').classList.add('hidden');
 document.getElementById('next').classList.remove('hidden');
 document.querySelectorAll('.choice,input').forEach(x=>x.disabled=true);
}
function next(){idx++;selection=null;spoken=false;questionMistakes=0;renderQuiz();window.scrollTo(0,0)}function finish(){let completedLesson=current;let score=Math.round(answers.filter(a=>a.good).length/answers.length*100),speech=answers.filter(a=>a.type==='speak').every(a=>a.good),passed=score>=80&&speech;state.attempts.push({lesson:current,lessonId:lessons[current].id,score,date:new Date().toLocaleDateString('nl-NL')});if(passed&&!state.passedIds.includes(lessons[current].id))state.passedIds.push(lessons[current].id);save();app.innerHTML=`<div class="card"><div class="eyebrow">Toets afgerond</div><div class="big">${score}%</div><h2>${passed?'Les behaald!':'Nog even oefenen'}</h2><p>${passed?'Je hebt de lesdoelen behaald. De volgende les is nu beschikbaar.':'Je hebt minimaal 80% nodig én beide spreekopdrachten moeten goed zijn. De volgende les blijft gesloten.'}</p>${answers.filter(a=>!a.good).length?`<h3>Extra aandacht voor</h3>${answers.filter(a=>!a.good).map(a=>`<span class="tag">${esc(a.expected)}</span>`).join('')}`:''}<p><button class="btn" onclick="current=null;tab='home';render();${passed?'':`start(${completedLesson});`}">${passed?'Terug naar overzicht':'Opnieuw oefenen'}</button></p></div>`;current=null}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{current=null;tab=b.dataset.tab;render()});render();</script></body></html>
