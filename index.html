<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#153c34"><title>Parliamo • Italiaans leren</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#18332c;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}header{background:#153c34;color:white;padding:24px 20px 28px;border-radius:0 0 26px 26px}header .brand{font-size:14px;letter-spacing:2px;font-weight:800;color:#c5e7c6}h1{font-size:30px;margin:8px 0}header p{color:#dceae3;margin:0}main{max-width:760px;margin:auto;padding:20px 16px 100px}.card{background:white;border:1px solid #e3e9e3;border-radius:20px;padding:20px;margin-bottom:14px;box-shadow:0 4px 16px #18332c08}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#527a68;font-weight:800}.muted{color:#66766d}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.pill{background:#e8f4e9;color:#276244;border-radius:99px;padding:6px 10px;font-size:12px;font-weight:750}.bar{height:10px;background:#e7ede8;border-radius:99px;overflow:hidden;margin:10px 0}.fill{height:100%;background:#3d9066;transition:width .3s}.btn{border:0;border-radius:13px;background:#1e6048;color:white;padding:13px 17px;font-size:15px;font-weight:700;cursor:pointer;min-height:46px}.btn.secondary{background:#eaf2ed;color:#1d5a44}.btn:disabled{opacity:.42;cursor:not-allowed}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.lesson{padding:15px;border:1px solid #e2eae4;border-radius:14px;background:#fff;text-align:left;cursor:pointer}.lesson:disabled{opacity:.48;cursor:not-allowed}.lesson strong{display:block;margin:6px 0}.lesson small{color:#65746b}.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:white;border-top:1px solid #e1e9e2;padding:10px 8px max(10px,env(safe-area-inset-bottom));gap:8px}.nav button{background:none;border:0;padding:10px 13px;color:#315745;font-weight:750;border-radius:10px}.nav button.active{background:#e8f3ea}.choices{display:grid;gap:10px;margin:16px 0}.choice{border:1px solid #cfdcd2;background:#fff;border-radius:12px;padding:13px;text-align:left;font-size:16px;cursor:pointer}.choice.selected{border:2px solid #246b4d;background:#e9f5ed}input[type=text]{width:100%;padding:14px;font-size:17px;border:1px solid #bacdc0;border-radius:12px;margin:12px 0}.feedback{background:#edf5ed;border-radius:12px;padding:12px;margin-top:12px;line-height:1.5}.feedback.bad{background:#fff2e8}.hidden{display:none}.word{font-size:31px;font-weight:800;margin:18px 0 6px}.sub{font-size:13px;color:#6a796e}.tag{display:inline-block;padding:5px 9px;border-radius:8px;background:#f1f4ef;color:#486553;font-size:12px;margin:3px 4px 3px 0}.big{font-size:35px;font-weight:850;margin:8px 0}.foot{font-size:12px;color:#6c776f;line-height:1.5}button:focus-visible,input:focus-visible{outline:3px solid #8dbb9b;outline-offset:2px}</style></head><body><header><div class="brand">PARLIAMO · ITALIAANS LEREN</div><h1 id="greeting">Ciao! 👋</h1><p>Van je eerste woord tot je eerste echte gesprek.</p></header><main id="app"></main><nav class="nav"><button data-tab="home" class="active">Overzicht</button><button data-tab="words">Woorden</button><button data-tab="practice">Oefenen</button><button data-tab="progress">Voortgang</button></nav><script>
const lessons=[
{title:'Ciao! Kennismaken',goal:'Groeten en jezelf voorstellen',explain:'Ciao betekent hallo of dag. Buongiorno is goedemorgen of goedendag. Mi chiamo betekent ik heet.',words:[['ciao','hallo / dag'],['buongiorno','goedendag'],['arrivederci','tot ziens'],['grazie','dank je'],['prego','graag gedaan'],['mi chiamo','ik heet'],['come stai?','hoe gaat het?'],['bene','goed'],['per favore','alsjeblieft'],['sì','ja'],['no','nee'],['buonasera','goedenavond'],['a presto','tot snel'],['scusa','sorry / pardon'],['piacere','aangenaam'],['salve','hallo (beleefd)'],['molto bene','heel goed'],['così così','zozo'],['e tu?','en jij?'],['buonanotte','welterusten']]},
{title:'Getallen en leeftijden',goal:'Tellen en je leeftijd zeggen',explain:'Ho ... anni betekent ik ben ... jaar oud. Letterlijk: ik heb ... jaren. Italiaans gebruikt hier avere (hebben).',words:[['uno','één'],['due','twee'],['tre','drie'],['quattro','vier'],['cinque','vijf'],['sei','zes'],['sette','zeven'],['otto','acht'],['nove','negen'],['dieci','tien'],['undici','elf'],['dodici','twaalf'],['tredici','dertien'],['quattordici','veertien'],['quindici','vijftien'],['sedici','zestien'],['diciassette','zeventien'],['diciotto','achttien'],['diciannove','negentien'],['venti','twintig']]},
{title:'Essere en avere',goal:'De twee belangrijkste werkwoorden',explain:'Essere = zijn: io sono (ik ben), tu sei (jij bent). Avere = hebben: io ho (ik heb), tu hai (jij hebt).',words:[['io','ik'],['tu','jij'],['lui','hij'],['lei','zij'],['noi','wij'],['voi','jullie'],['loro','zij (meervoud)'],['sono','ik ben'],['sei','jij bent'],['è','hij/zij is'],['siamo','wij zijn'],['siete','jullie zijn'],['ho','ik heb'],['hai','jij hebt'],['ha','hij/zij heeft'],['abbiamo','wij hebben'],['avete','jullie hebben'],['hanno','zij hebben'],['felice','blij'],['stanco','moe']]},
{title:'In het café',goal:'Eenvoudig bestellen',explain:'Vorrei betekent ik zou graag willen. Un caffè, per favore is een beleefde bestelling. Quanto costa? betekent hoeveel kost het?',words:[['un caffè','een koffie'],['un tè','een thee'],['acqua','water'],['acqua naturale','plat water'],['acqua frizzante','bruiswater'],['latte','melk'],['pane','brood'],['cornetto','croissant'],['zucchero','suiker'],['senza','zonder'],['con','met'],['vorrei','ik zou graag willen'],['quanto costa?','hoeveel kost het?'],['il conto','de rekening'],['un tavolo','een tafel'],['un bicchiere','een glas'],['una bottiglia','een fles'],['buono','lekker / goed'],['caldo','warm'],['freddo','koud']]},
{title:'Zinnen bouwen',goal:'Zelf vragen en antwoorden maken',explain:'Een Italiaanse basiszin heeft vaak de volgorde onderwerp + werkwoord + aanvulling. Bijvoorbeeld: Io sono Marco. Een onderwerp kan vaak weg: Sono Marco.',words:[['dove','waar'],['quando','wanneer'],['chi','wie'],['che cosa','wat'],['perché','waarom'],['come','hoe'],['qui','hier'],['lì','daar'],['oggi','vandaag'],['domani','morgen'],['ieri','gisteren'],['casa','huis'],['scuola','school'],['amico','vriend'],['amica','vriendin'],['parlo','ik spreek'],['italiano','Italiaans'],['olandese','Nederlands'],['capisco','ik begrijp'],['non capisco','ik begrijp het niet']]}
];
const key='parliamo-v1';let state;try{state=JSON.parse(localStorage.getItem(key))||{passed:[],attempts:[],reviews:{},name:''}}catch{state={passed:[],attempts:[],reviews:{},name:''}};let tab='home',current=null,idx=0,answers=[],selection=null,spoken=false,feedback=null;const app=document.getElementById('app');const save=()=>localStorage.setItem(key,JSON.stringify(state));const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[?!.,]/g,'').replace(/\s+/g,' ').trim();const speak=t=>{if(!('speechSynthesis'in window)){alert('Spraakweergave niet beschikbaar in deze browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.83;speechSynthesis.speak(u)};function quizFor(n){let l=lessons[n],a=l.words;let qs=[];for(let i=0;i<4;i++){let j=(i*3+1)%20;qs.push({type:'choice',question:`Wat betekent “${a[j][0]}”?`,correct:a[j][1],options:[a[j][1],a[(j+5)%20][1],a[(j+9)%20][1],a[(j+13)%20][1]].sort(()=>Math.random()-.5),word:a[j][0]})}for(let i=0;i<3;i++){let j=(i*4+2)%20;qs.push({type:'write',question:`Schrijf in het Italiaans: ${a[j][1]}`,correct:a[j][0],word:a[j][0]})}qs.push({type:'listen',question:'Luister en schrijf het Italiaanse woord of de uitdrukking.',correct:a[8][0],word:a[8][0]});qs.push({type:'speak',question:`Zeg hardop: “${a[4][0]}”`,correct:a[4][0],word:a[4][0]});qs.push({type:'speak',question:`Zeg hardop: “${a[6][0]}”`,correct:a[6][0],word:a[6][0]});return qs}let questions=[];function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(current!==null){renderQuiz();return}if(tab==='home'){let p=state.passed.length;app.innerHTML=`<div class="card"><div class="eyebrow">Jouw leerroute · pre-A1</div><div class="row"><div><div class="big">${p}/5</div><div class="muted">lessen behaald</div></div><span class="pill">${p===5?'Module afgerond':'Startniveau'}</span></div><div class="bar"><div class="fill" style="width:${p*20}%"></div></div><p class="muted">Een les is behaald bij minimaal 80% en beide spreekopdrachten afgerond. Bij onvoldoende oefen je opnieuw.</p></div><div class="card"><div class="eyebrow">Lessen</div><div class="grid">${lessons.map((l,i)=>`<button class="lesson" ${i>0&&!state.passed.includes(i-1)?'disabled':''} onclick="start(${i})"><span class="pill">${state.passed.includes(i)?'✓ Behaald':i>0&&!state.passed.includes(i-1)?'🔒 Gesloten':'Beschikbaar'}</span><strong>${i+1}. ${esc(l.title)}</strong><small>${esc(l.goal)}</small></button>`).join('')}</div></div><div class="card"><div class="eyebrow">Werkwijze</div><p>Lees de uitleg, beluister woorden en maak 10 toetsvragen. Je krijgt gerichte feedback en kunt opnieuw oefenen.</p></div>`}else if(tab==='words'){let available=lessons.slice(0,Math.min(5,state.passed.length+1));app.innerHTML=`<div class="card"><div class="eyebrow">Woordentrainer</div><h2>Luister, leer en herhaal</h2><p class="muted">${available.length*20} woorden beschikbaar. Tik op het luidsprekertje om de Italiaanse uitspraak te horen.</p><select id="wl" style="padding:12px;border-radius:10px;width:100%;margin-bottom:12px">${available.map((l,i)=>`<option value="${i}">${i+1}. ${esc(l.title)}</option>`).join('')}</select><div id="wordlist"></div></div>`;document.getElementById('wl').onchange=wordlist;wordlist()}else if(tab==='practice'){app.innerHTML=`<div class="card"><div class="eyebrow">Gericht oefenen</div><h2>Extra oefenen</h2><p>Kies een vrijgespeelde les. Je kunt dezelfde vaardigheden opnieuw trainen. De toets bevat steeds wisselende antwoordvolgordes.</p>${lessons.map((l,i)=>`<p><button class="btn ${i>0&&!state.passed.includes(i-1)?'secondary':''}" ${i>0&&!state.passed.includes(i-1)?'disabled':''} onclick="start(${i})">${esc(l.title)} →</button></p>`).join('')}</div>`}else{let attempts=state.attempts;app.innerHTML=`<div class="card"><div class="eyebrow">Mijn ontwikkeling</div><h2>Voortgang</h2><p><strong>${state.passed.length}</strong> van de 5 lessen behaald</p><p><strong>${attempts.length}</strong> toetsen gemaakt</p><p><strong>${attempts.length?Math.round(attempts.reduce((s,a)=>s+a.score,0)/attempts.length):0}%</strong> gemiddelde toetsscore</p><div class="bar"><div class="fill" style="width:${state.passed.length*20}%"></div></div><h3>Toetshistorie</h3>${attempts.slice(-8).reverse().map(a=>`<p class="muted">${esc(lessons[a.lesson].title)} · ${a.score}% · ${esc(a.date)}</p>`).join('')||'<p class="muted">Nog geen toetsen gemaakt.</p>'}<p class="foot">Je voortgang staat uitsluitend op dit apparaat in deze browser. Wis je browsergegevens, dan verdwijnt deze. Er is nog geen account of synchronisatie.</p></div>`}}
function wordlist(){let n=Number(document.getElementById('wl').value);document.getElementById('wordlist').innerHTML=lessons[n].words.map(([it,nl])=>`<div class="row" style="border-bottom:1px solid #eef2ee;padding:11px 0"><div><strong>${esc(it)}</strong><div class="sub">${esc(nl)}</div></div><button class="btn secondary" aria-label="Luister naar ${esc(it)}" onclick="speak(${JSON.stringify(it).replace(/"/g,'&quot;')})">▶</button></div>`).join('')}
function start(n){current=n;idx=-1;questions=quizFor(n);answers=[];selection=null;spoken=false;feedback=null;renderQuiz();window.scrollTo(0,0)}function renderQuiz(){let l=lessons[current];if(idx===-1){app.innerHTML=`<div class="card"><span class="pill">Les ${current+1}</span><h2>${esc(l.title)}</h2><p>${esc(l.goal)}</p><div class="feedback">${esc(l.explain)}</div><h3>Woorden van deze les</h3>${l.words.slice(0,8).map(w=>`<span class="tag">${esc(w[0])} — ${esc(w[1])}</span>`).join('')}<p><button class="btn secondary" onclick="speak(${JSON.stringify(l.words[0][0]).replace(/"/g,'&quot;')})">▶ Luister naar voorbeeld</button></p><button class="btn" onclick="idx=0;renderQuiz()">Start toets (10 vragen) →</button><p class="foot">Spreken vereist microfoontoestemming en browserondersteuning. Zonder spraakherkenning kun je spreekopdrachten niet automatisch laten beoordelen.</p></div>`;return}if(idx>=questions.length){finish();return}let q=questions[idx];app.innerHTML=`<div class="card"><div class="row"><span class="eyebrow">Les ${current+1} · Vraag ${idx+1}/10</span><span class="pill">${q.type==='speak'?'Spreken':q.type==='listen'?'Luisteren':q.type==='write'?'Schrijven':'Woordenschat'}</span></div><div class="bar"><div class="fill" style="width:${idx*10}%"></div></div><h2>${esc(q.question)}</h2>${q.type==='choice'?`<div class="choices">${q.options.map((o,i)=>`<button class="choice" onclick="choose(${i})" id="opt${i}">${esc(o)}</button>`).join('')}</div>`:q.type==='write'?`<input id="written" type="text" autocomplete="off" placeholder="Typ je antwoord" />`:q.type==='listen'?`<p><button class="btn secondary" onclick="speak(${JSON.stringify(q.correct).replace(/"/g,'&quot;')})">▶ Speel fragment af</button></p><input id="written" type="text" autocomplete="off" placeholder="Wat hoor je?" />`:`<p><button class="btn secondary" onclick="speak(${JSON.stringify(q.correct).replace(/"/g,'&quot;')})">▶ Luister naar voorbeeld</button></p><button class="btn secondary" id="mic" onclick="recordSpeech()">🎙 Spreek antwoord in</button><p class="sub" id="micStatus">De browser beoordeelt je uitspraak via spraakherkenning. Dit is een indicatie, geen betrouwbare fonetische analyse.</p>`}<div id="fb"></div><p><button class="btn" id="check" onclick="check()" ${q.type==='speak'?'disabled':''}>Controleer antwoord</button> <button class="btn secondary hidden" id="next" onclick="next()">Volgende →</button></p></div>`;if(q.type==='listen')setTimeout(()=>speak(q.correct),250)}function choose(i){selection=questions[idx].options[i];document.querySelectorAll('.choice').forEach((el,j)=>el.classList.toggle('selected',j===i))}function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('micStatus').textContent='Spraakherkenning is hier niet beschikbaar. Probeer Chrome of een browser met SpeechRecognition-ondersteuning.';return}let r=new SR();r.lang='it-IT';r.interimResults=false;r.maxAlternatives=3;document.getElementById('micStatus').textContent='Luistert...';r.onresult=e=>{spoken=Array.from(e.results[0]).some(a=>norm(a.transcript)===norm(questions[idx].correct));document.getElementById('micStatus').textContent='Herkend: '+e.results[0][0].transcript+(spoken?' ✓':' — probeer nog eens');document.getElementById('check').disabled=false};r.onerror=e=>document.getElementById('micStatus').textContent='Microfoonfout: '+e.error;r.start()}function check(){let q=questions[idx],v=q.type==='choice'?selection:q.type==='speak'?(spoken?q.correct:''):document.getElementById('written').value; if(!v&&q.type!=='speak'){alert('Vul eerst een antwoord in.');return}let good=norm(v)===norm(q.correct);answers.push({good,expected:q.correct,got:v,type:q.type});document.getElementById('fb').innerHTML=`<div class="feedback ${good?'':'bad'}"><strong>${good?'Goed gedaan!':'Nog niet goed.'}</strong><br>Correct: <strong>${esc(q.correct)}</strong>${good?'':'<br>Luister opnieuw, vergelijk je antwoord en probeer het later nog eens.'}</div>`;document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.querySelectorAll('.choice,input').forEach(x=>x.disabled=true)}function next(){idx++;selection=null;spoken=false;renderQuiz();window.scrollTo(0,0)}function finish(){let completedLesson=current;let score=Math.round(answers.filter(a=>a.good).length/answers.length*100),speech=answers.filter(a=>a.type==='speak').every(a=>a.good),passed=score>=80&&speech;state.attempts.push({lesson:current,score,date:new Date().toLocaleDateString('nl-NL')});if(passed&&!state.passed.includes(current))state.passed.push(current);save();app.innerHTML=`<div class="card"><div class="eyebrow">Toets afgerond</div><div class="big">${score}%</div><h2>${passed?'Les behaald!':'Nog even oefenen'}</h2><p>${passed?'Je hebt de lesdoelen behaald. De volgende les is nu beschikbaar.':'Je hebt minimaal 80% nodig én beide spreekopdrachten moeten goed zijn. De volgende les blijft gesloten.'}</p>${answers.filter(a=>!a.good).length?`<h3>Extra aandacht voor</h3>${answers.filter(a=>!a.good).map(a=>`<span class="tag">${esc(a.expected)}</span>`).join('')}`:''}<p><button class="btn" onclick="current=null;tab='home';render();${passed?'':`start(${completedLesson});`}">${passed?'Terug naar overzicht':'Opnieuw oefenen'}</button></p></div>`;current=null}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{current=null;tab=b.dataset.tab;render()});render();</script></body></html>
