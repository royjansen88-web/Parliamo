  const saved=localStorage.getItem('parliamo-voice')||'';
  select.innerHTML='<option value="">Automatisch (Italiaans)</option>'+italianVoices.map(v=>'<option value="'+esc(v.voiceURI)+'" '+(saved===v.voiceURI?'selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('');
 }
}
if('speechSynthesis' in window){refreshItalianVoices();speechSynthesis.addEventListener('voiceschanged',refreshItalianVoices)}
function speak(t){
 if(!('speechSynthesis' in window)){alert('Deze browser ondersteunt geen spraakweergave.');return}
 refreshItalianVoices();
 if(!italianVoices.length){alert('Geen Italiaanse stem gevonden. Installeer in de instellingen van je apparaat een Italiaanse stem en heropen de website.');return}
 speechSynthesis.cancel();
 const saved=localStorage.getItem('parliamo-voice');
 const preferred=italianVoices.find(v=>v.voiceURI===saved)||italianVoices.find(v=>/premium|enhanced|natural|neural/i.test(v.name))||italianVoices.find(v=>v.localService)||italianVoices[0];
 const u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.voice=preferred;
 u.rate=Number(localStorage.getItem('parliamo-speed')||'0.85');u.pitch=1;
 speechSynthesis.speak(u);
}
function setSpeed(value){localStorage.setItem('parliamo-speed',value);const el=document.getElementById('speedValue');if(el)el.textContent=value==='0.7'?'Langzaam':'Normaal'}
function setVoice(value){localStorage.setItem('parliamo-voice',value);speak('Buongiorno, come stai?')}
function audioSettings(){return `<div class="card"><div class="eyebrow">Uitspraakinstellingen</div><p class="muted">Kies zelf de Italiaanse stem die op jouw apparaat het natuurlijkst klinkt. Een niet-Italiaanse stem wordt nooit gebruikt.</p><label for="italianVoice">Italiaanse stem</label><select id="italianVoice" onchange="setVoice(this.value)" style="display:block;margin:10px 0;padding:10px;width:100%;border-radius:10px"><option value="">Automatisch (Italiaans)</option>${italianVoices.map(v=>'<option value="'+esc(v.voiceURI)+'" '+(localStorage.getItem('parliamo-voice')===v.voiceURI?'selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>').join('')}</select><label for="speechSpeed">Spreeksnelheid: <strong id="speedValue">${localStorage.getItem('parliamo-speed')==='0.7'?'Langzaam':'Normaal'}</strong></label><select id="speechSpeed" onchange="setSpeed(this.value)" style="display:block;margin:10px 0;padding:10px;width:100%;border-radius:10px"><option value="0.85" ${localStorage.getItem('parliamo-speed')!=='0.7'?'selected':''}>Normaal</option><option value="0.7" ${localStorage.getItem('parliamo-speed')==='0.7'?'selected':''}>Langzaam</option></select><button class="btn secondary" onclick="speak('Buongiorno, come stai?')">▶ Test Italiaanse stem</button><p class="foot">De kwaliteit hangt af van de stemmen op je apparaat. Dit is nog geen opname van een moedertaalspreker.</p></div>`};function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function quizFor(n){
 const words=lessons[n].words;
 const chosen=shuffle(words.map((_,i)=>i)).slice(0,10);
 const qs=[];
 for(let i=0;i<4;i++){
  const w=words[chosen[i]], distractors=shuffle([...new Set(words.map(x=>x[1]).filter(x=>x!==w[1]))]).slice(0,3);
  qs.push({type:'choice',question:`Wat betekent “${w[0]}”?`,correct:w[1],options:shuffle([w[1],...distractors]),word:w[0]});
 }
 for(let i=4;i<7;i++){
  const w=words[chosen[i]];
  qs.push({type:'write',question:`Schrijf in het Italiaans: ${w[1]}`,correct:w[0],word:w[0]});
 }
 const listening=words[chosen[7]];
 qs.push({type:'listen',question:'Luister en schrijf het Italiaanse woord of de uitdrukking.',correct:listening[0],word:listening[0]});
 for(let i=8;i<10;i++){
  const w=words[chosen[i]];
  qs.push({type:'speak',question:`Zeg hardop: “${w[0]}”`,correct:w[0],word:w[0]});
 }
 if(n>0){
  const pool=[];
  for(let lessonIndex=0;lessonIndex<n;lessonIndex++){
   if(!state.passedIds.includes(lessons[lessonIndex].id))continue;
   lessons[lessonIndex].words.forEach(([it,nl],wordIndex)=>{
    const key=lessons[lessonIndex].id+':'+wordIndex;
    const record=state.reviews[key]||{};
    pool.push({it,nl,key,lessonIndex,due:record.due||0,stage:record.stage||0});
   });
  }
  const now=Date.now();
  const due=shuffle(pool.filter(w=>w.due<=now)).sort((a,b)=>a.due-b.due);
  const selected=[...due.slice(0,2)];
  if(selected.length<2)selected.push(...shuffle(pool.filter(w=>!selected.includes(w))).slice(0,2-selected.length));
  selected.forEach((w,i)=>{
   const position=i===0?1:5;
   const distractors=shuffle([...new Set(words.map(x=>x[1]).filter(x=>x!==w.nl))]).slice(0,3);
   qs[position]={type:'choice',question:`Herhaling uit les ${w.lessonIndex+1}: wat betekent “${w.it}”?`,correct:w.nl,options:shuffle([w.nl,...distractors]),word:w.it,reviewKey:w.key,sourceLesson:w.lessonIndex};
  });
 }
 return qs;
}
let questions=[];function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(current!==null){renderQuiz();return}if(tab==='home'){let p=state.passed.length;app.innerHTML=`<div class="card"><div class="eyebrow">Jouw leerroute · pre-A1 en A1</div><div class="row"><div><div class="big">${p}/${lessons.length}</div><div class="muted">lessen behaald</div></div><span class="pill">${p===lessons.length?'Module afgerond':'Startniveau'}</span></div><div class="bar"><div class="fill" style="width:${p/lessons.length*100}%"></div></div><p class="muted">Een les is behaald bij minimaal 80% en beide spreekopdrachten afgerond. Bij onvoldoende oefen je opnieuw.</p></div><div class="card"><div class="eyebrow">Lessen</div><div class="grid">${lessons.map((l,i)=>`<button class="lesson" ${i>0&&!state.passed.includes(i-1)?'disabled':''} onclick="start(${i})"><span class="pill">${state.passed.includes(i)?'✓ Behaald':i>0&&!state.passed.includes(i-1)?'🔒 Gesloten':'Beschikbaar'}</span><strong>${i+1}. ${esc(l.title)}</strong><small>${esc(l.goal)}</small></button>`).join('')}</div></div><div class="card"><div class="eyebrow">Werkwijze</div><p>Lees de uitleg, beluister woorden en maak 10 toetsvragen. Vanaf les 2 herhaal je automatisch twee woorden uit eerdere behaalde lessen. Fouten keren sneller terug.</p></div>`}else if(tab==='words'){let available=lessons.slice(0,Math.min(lessons.length,state.passed.length+1));app.innerHTML=`<div class="card"><div class="eyebrow">Woordentrainer</div><h2>Luister, leer en herhaal</h2><p class="muted">${available.length*20} woorden beschikbaar. Tik op het luidsprekertje om de Italiaanse uitspraak te horen.</p><select id="wl" style="padding:12px;border-radius:10px;width:100%;margin-bottom:12px">${available.map((l,i)=>`<option value="${i}">${i+1}. ${esc(l.title)}</option>`).join('')}</select><div id="wordlist"></div></div>`;document.getElementById('wl').onchange=wordlist;wordlist();app.insertAdjacentHTML('beforeend',audioSettings())}else if(tab==='practice'){app.innerHTML=`<div class="card"><div class="eyebrow">Gericht oefenen</div><h2>Extra oefenen</h2><p>Kies een vrijgespeelde les. Je kunt dezelfde vaardigheden opnieuw trainen. Bij iedere poging krijg je nieuwe woorden. Vanaf les 2 komen er ook twee herhalingsvragen uit eerder behaalde lessen. Lastige woorden keren sneller terug.</p>${lessons.map((l,i)=>`<p><button class="btn ${i>0&&!state.passed.includes(i-1)?'secondary':''}" ${i>0&&!state.passed.includes(i-1)?'disabled':''} onclick="start(${i})">${esc(l.title)} →</button></p>`).join('')}</div>`}else{let attempts=state.attempts;app.innerHTML=`<div class="card"><div class="eyebrow">Mijn ontwikkeling</div><h2>Voortgang</h2><p><strong>${state.passed.length}</strong> van de ${lessons.length} lessen behaald</p><p><strong>${attempts.length}</strong> toetsen gemaakt</p><p><strong>${attempts.length?Math.round(attempts.reduce((s,a)=>s+a.score,0)/attempts.length):0}%</strong> gemiddelde toetsscore</p><div class="bar"><div class="fill" style="width:${state.passed.length/lessons.length*100}%"></div></div><h3>Toetshistorie</h3>${attempts.slice(-8).reverse().map(a=>`<p class="muted">${esc(lessons[a.lesson].title)} · ${a.score}% · ${esc(a.date)}</p>`).join('')||'<p class="muted">Nog geen toetsen gemaakt.</p>'}</div><div class="card"><div class="eyebrow">Veiligstellen van je voortgang</div><p>Je voortgang staat nu in deze browser. Maak regelmatig een back-up en bewaar die op een veilige plek. Met terugzetten vervang je de huidige voortgang.</p><div class="row" style="flex-wrap:wrap;justify-content:flex-start"><button class="btn" onclick="exportProgress()">Download back-up</button><button class="btn secondary" onclick="document.getElementById('progressBackup').click()">Herstel back-up</button><input id="progressBackup" type="file" accept=".json,application/json" style="display:none" onchange="importProgress(this)"></div><p class="foot">De code wordt via GitHub bewaard met versiegeschiedenis. Je leerresultaten worden nog niet online gesynchroniseerd.</p></div>`}}
function wordlist(){let n=Number(document.getElementById('wl').value);document.getElementById('wordlist').innerHTML=lessons[n].words.map(([it,nl])=>`<div class="row" style="border-bottom:1px solid #eef2ee;padding:11px 0"><div><strong>${esc(it)}</strong><div class="sub">${esc(nl)}</div></div><button class="btn secondary" aria-label="Luister naar ${esc(it)}" onclick="speak(${JSON.stringify(it).replace(/"/g,'&quot;')})">▶</button></div>`).join('')}
function start(n){current=n;idx=-1;questions=quizFor(n);answers=[];selection=null;spoken=false;feedback=null;renderQuiz();window.scrollTo(0,0)}function renderQuiz(){let l=lessons[current];if(idx===-1){app.innerHTML=`<div class="card"><span class="pill">Les ${current+1}</span><h2>${esc(l.title)}</h2><p>${esc(l.goal)}</p><div class="feedback">${esc(l.explain)}</div><div class="card" style="box-shadow:none;border-color:#cfe3d4;margin-top:14px"><div class="eyebrow">Grammatica en voorbeeldzin</div><h3>${esc(grammarNotes[current][0])}</h3><p>${esc(grammarNotes[current][1])}</p><p><strong>${esc(grammarNotes[current][2])}</strong> <button class="btn secondary" onclick="speak(grammarNotes[current][2])">▶</button></p><p class="muted">${esc(grammarNotes[current][3])}</p></div><h3>Woorden van deze les</h3>${l.words.map(([it,nl])=>`<div class="row" style="border-bottom:1px solid #eef2ee;padding:9px 0;gap:12px"><div><strong>${esc(it)}</strong><div class="sub">${esc(nl)}</div></div><button class="btn secondary" aria-label="Luister naar ${esc(it)}" onclick="speak(${JSON.stringify(it).replace(/"/g,'&quot;')})">▶</button></div>`).join('')}<button class="btn" onclick="idx=0;renderQuiz()">Start toets (10 vragen) →</button><p class="foot">Spreken vereist microfoontoestemming en browserondersteuning. Zonder spraakherkenning kun je spreekopdrachten niet automatisch laten beoordelen.</p></div>`;return}if(idx>=questions.length){finish();return}let q=questions[idx];app.innerHTML=`<div class="card"><div class="row"><span class="eyebrow">Les ${current+1} · Vraag ${idx+1}/10</span><span class="pill">${q.type==='speak'?'Spreken':q.type==='listen'?'Luisteren':q.type==='write'?'Schrijven':'Woordenschat'}</span></div><div class="bar"><div class="fill" style="width:${idx*10}%"></div></div><h2>${esc(q.question)}</h2>${q.type==='choice'?`<div class="choices">${q.options.map((o,i)=>`<button class="choice" onclick="choose(${i})" id="opt${i}">${esc(o)}</button>`).join('')}</div>`:q.type==='write'?`<input id="written" type="text" autocomplete="off" placeholder="Typ je antwoord" />`:q.type==='listen'?`<p><button class="btn secondary" onclick="speak(${JSON.stringify(q.correct).replace(/"/g,'&quot;')})">▶ Speel fragment af</button></p><input id="written" type="text" autocomplete="off" placeholder="Wat hoor je?" />`:`<p><button class="btn secondary" onclick="speak(${JSON.stringify(q.correct).replace(/"/g,'&quot;')})">▶ Luister naar voorbeeld</button></p><button class="btn secondary" id="mic" onclick="recordSpeech()">🎙 Spreek antwoord in</button><p class="sub" id="micStatus">De browser beoordeelt je uitspraak via spraakherkenning. Dit is een indicatie, geen betrouwbare fonetische analyse.</p>`}<div id="fb"></div><p><button class="btn" id="check" onclick="check()" ${q.type==='speak'?'disabled':''}>Controleer antwoord</button> <button class="btn secondary hidden" id="next" onclick="next()">Volgende →</button></p></div>`;if(q.type==='listen')setTimeout(()=>speak(q.correct),250)}function choose(i){selection=questions[idx].options[i];document.querySelectorAll('.choice').forEach((el,j)=>el.classList.toggle('selected',j===i))}function recordSpeech(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){document.getElementById('micStatus').textContent='Spraakherkenning is hier niet beschikbaar. Probeer Chrome of een browser met SpeechRecognition-ondersteuning.';return}let r=new SR();r.lang='it-IT';r.interimResults=false;r.maxAlternatives=3;document.getElementById('micStatus').textContent='Luistert...';r.onresult=e=>{spoken=Array.from(e.results[0]).some(a=>norm(a.transcript)===norm(questions[idx].correct));document.getElementById('micStatus').textContent='Herkend: '+e.results[0][0].transcript+(spoken?' ✓':' — probeer nog eens');document.getElementById('check').disabled=false};r.onerror=e=>document.getElementById('micStatus').textContent='Microfoonfout: '+e.error;r.start()}function check(){let q=questions[idx],v=q.type==='choice'?selection:q.type==='speak'?(spoken?q.correct:''):document.getElementById('written').value; if(!v&&q.type!=='speak'){alert('Vul eerst een antwoord in.');return}let good=norm(v)===norm(q.correct);answers.push({good,expected:q.correct,got:v,type:q.type,reviewKey:q.reviewKey||null});
if(q.reviewKey){
 const prev=state.reviews[q.reviewKey]||{stage:0};
 const stage=good?Math.min((prev.stage||0)+1,5):0;
 const days=[1,2,4,7,14,30][stage];
 state.reviews[q.reviewKey]={stage,due:Date.now()+days*86400000,lastCorrect:good,lastSeen:new Date().toISOString()};
 save();
}document.getElementById('fb').innerHTML=`<div class="feedback ${good?'':'bad'}"><strong>${good?'Goed gedaan!':'Nog niet goed.'}</strong><br>Correct: <strong>${esc(q.correct)}</strong>${good?'':'<br>Luister opnieuw, vergelijk je antwoord en probeer het later nog eens.'}</div>`;document.getElementById('check').classList.add('hidden');document.getElementById('next').classList.remove('hidden');document.querySelectorAll('.choice,input').forEach(x=>x.disabled=true)}function next(){idx++;selection=null;spoken=false;renderQuiz();window.scrollTo(0,0)}function finish(){let completedLesson=current;let score=Math.round(answers.filter(a=>a.good).length/answers.length*100),speech=answers.filter(a=>a.type==='speak').every(a=>a.good),passed=score>=80&&speech;state.attempts.push({lesson:current,lessonId:lessons[current].id,score,date:new Date().toLocaleDateString('nl-NL')});if(passed&&!state.passedIds.includes(lessons[current].id))state.passedIds.push(lessons[current].id);save();app.innerHTML=`<div class="card"><div class="eyebrow">Toets afgerond</div><div class="big">${score}%</div><h2>${passed?'Les behaald!':'Nog even oefenen'}</h2><p>${passed?'Je hebt de lesdoelen behaald. De volgende les is nu beschikbaar.':'Je hebt minimaal 80% nodig én beide spreekopdrachten moeten goed zijn. De volgende les blijft gesloten.'}</p>${answers.filter(a=>!a.good).length?`<h3>Extra aandacht voor</h3>${answers.filter(a=>!a.good).map(a=>`<span class="tag">${esc(a.expected)}</span>`).join('')}`:''}<p><button class="btn" onclick="current=null;tab='home';render();${passed?'':`start(${completedLesson});`}">${passed?'Terug naar overzicht':'Opnieuw oefenen'}</button></p></div>`;current=null}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{current=null;tab=b.dataset.tab;render()});render();</script></body></html>
